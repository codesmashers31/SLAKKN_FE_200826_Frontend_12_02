<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    

   <section>
    <div>
        <form action="" method="get" enctype="multipart/form-data">
            <label for="username">Enter the Name</label>
            <input id="username"  type="text" placeholder="Enter With caps" required />
            <label>Enter the Age</label>
            <input  type="number" />
            <label>Enter the Mobile</label>
            <input  type="tel" />
            <input  type="datetime-local" />
            <input  type="email" />
            <input  type="file" />
            <input  type="password" />
            <input  type="radio" name="gender" />Male
            <input  type="radio" name="gender" />Female
            <input type="checkbox" name="skills">HTML
            <input type="checkbox" name="skills">CSS
            <input type="checkbox" name="skills">JS
            <input type="checkbox" name="skills">PYTHON

            <select required>
 
                <option value="html"  >HTML</option>
                <option value="css">CSS</option>
                <option value="js">JS</option>

            </select>
            <textarea required  class="" id="" name=""  placeholder="Enter the Reason"></textarea>
            <input type="submit" value="Regsiter">
        </form>
    </div>
   </section>


</body>
</html>
